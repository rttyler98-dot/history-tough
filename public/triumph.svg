<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

    <!-- Background -->
    <rect width="1920" height="1080" fill="#ffd700" />

    <!-- Sunburst -->
    <g stroke="#ffea00" stroke-width="40">
        <line x1="960" y1="540" x2="0" y2="0" />
        <line x1="960" y1="540" x2="960" y2="0" />
        <line x1="960" y1="540" x2="1920" y2="0" />
        <line x1="960" y1="540" x2="1920" y2="540" />
        <line x1="960" y1="540" x2="1920" y2="1080" />
        <line x1="960" y1="540" x2="960" y2="1080" />
        <line x1="960" y1="540" x2="0" y2="1080" />
        <line x1="960" y1="540" x2="0" y2="540" />
    </g>

    <!-- Throne -->
    <rect x="760" y="500" width="400" height="500" fill="#b8860b" stroke="#000000" stroke-width="8" />
    <path d="M 760,500 L 760,250 C 960,100 1160,250 1160,500 Z" fill="#daa520" stroke="#000000" stroke-width="8" />
    <circle cx="960" cy="250" r="50" fill="#ff4500" stroke="#000000" stroke-width="8" />

    <!-- Triumphant Caesar -->
    <g transform="translate(960, 500)">
        <!-- Body / Toga -->
        <path d="M -80,300 C -90,120 -40,50 0,50 C 40,50 90,120 80,300 Z" fill="#ffffff" stroke="#000000" stroke-width="8" />
        <!-- Purple Sash (Lots of it!) -->
        <path d="M 50,100 L -80,300 L -20,300 L 90,130 Z" fill="#6a0dad" stroke="#000000" stroke-width="4" />

        <!-- Arms raised -->
        <path d="M -30,120 L -150,0" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round" />
        <path d="M 30,120 L 150,0" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round" />

        <!-- Head -->
        <circle cx="0" cy="0" r="60" fill="#ffdfc4" stroke="#000000" stroke-width="8" />
        <!-- Eyes (Happy) -->
        <path d="M -25,-10 Q -15,-20 -5,-10" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
        <path d="M 5,-10 Q 15,-20 25,-10" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
        <!-- Mouth (Big Smile) -->
        <path d="M -20,20 Q 0,40 20,20" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />

        <!-- Fancy Laurel Wreath -->
        <path d="M -60,-15 Q 0,-50 60,-15" fill="none" stroke="#228b22" stroke-width="15" />
        <circle cx="-45" cy="-25" r="10" fill="#32cd32" stroke="#000" stroke-width="2" />
        <circle cx="-25" cy="-35" r="10" fill="#32cd32" stroke="#000" stroke-width="2" />
        <circle cx="0" cy="-40" r="10" fill="#32cd32" stroke="#000" stroke-width="2" />
        <circle cx="25" cy="-35" r="10" fill="#32cd32" stroke="#000" stroke-width="2" />
        <circle cx="45" cy="-25" r="10" fill="#32cd32" stroke="#000" stroke-width="2" />
    </g>

    <!-- Confetti -->
    <rect x="300" y="200" width="20" height="40" fill="#ff0000" transform="rotate(45 300 200)" />
    <rect x="500" y="400" width="20" height="40" fill="#00ff00" transform="rotate(-30 500 400)" />
    <rect x="1500" y="150" width="20" height="40" fill="#0000ff" transform="rotate(70 1500 150)" />
    <rect x="1300" y="600" width="20" height="40" fill="#ff00ff" transform="rotate(-15 1300 600)" />
    <rect x="100" y="700" width="20" height="40" fill="#00ffff" transform="rotate(80 100 700)" />
    <rect x="1700" y="800" width="20" height="40" fill="#ff8c00" transform="rotate(-50 1700 800)" />

</svg>