<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

    <!-- Background -->
    <rect width="1920" height="1080" fill="#e2d6c3" />

    <!-- Floor -->
    <polygon points="0,800 1920,800 1920,1080 0,1080" fill="#c4b69d" />
    <line x1="0" y1="800" x2="1920" y2="800" stroke="#8a7c64" stroke-width="5" />

    <!-- Columns -->
    <rect x="200" y="0" width="150" height="800" fill="#fdfcf8" stroke="#8a7c64" stroke-width="4" />
    <rect x="850" y="0" width="150" height="800" fill="#fdfcf8" stroke="#8a7c64" stroke-width="4" />
    <rect x="1500" y="0" width="150" height="800" fill="#fdfcf8" stroke="#8a7c64" stroke-width="4" />

    <!-- Cartoon Senator 1 (Left) -->
    <g transform="translate(400, 550)">
        <!-- Body / Toga -->
        <path d="M -50,250 C -60,100 -20,50 0,50 C 20,50 60,100 50,250 Z" fill="#ffffff" stroke="#000000" stroke-width="8" />
        <!-- Head -->
        <circle cx="0" cy="0" r="50" fill="#ffdfc4" stroke="#000000" stroke-width="8" />
        <!-- Eyes -->
        <circle cx="-15" cy="-5" r="5" fill="#000000" />
        <circle cx="15" cy="-5" r="5" fill="#000000" />
        <!-- Mouth -->
        <path d="M -10,20 Q 0,25 10,20" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Cartoon Caesar (Center) -->
    <g transform="translate(925, 520)">
        <!-- Body / Toga -->
        <path d="M -60,280 C -70,100 -30,40 0,40 C 30,40 70,100 60,280 Z" fill="#ffffff" stroke="#000000" stroke-width="8" />
        <!-- Purple Sash -->
        <path d="M 40,80 L -40,280 L -60,280 L 20,80 Z" fill="#6a0dad" stroke="#000000" stroke-width="4" />
        <!-- Head -->
        <circle cx="0" cy="0" r="55" fill="#ffdfc4" stroke="#000000" stroke-width="8" />
        <!-- Eyes -->
        <circle cx="-15" cy="-5" r="5" fill="#000000" />
        <circle cx="15" cy="-5" r="5" fill="#000000" />
        <!-- Mouth -->
        <path d="M -15,20 Q 0,30 15,20" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
        <!-- Laurel Wreath -->
        <path d="M -55,-10 Q 0,-40 55,-10" fill="none" stroke="#2e8b57" stroke-width="12" />
        <circle cx="-40" cy="-20" r="8" fill="#2e8b57" />
        <circle cx="-20" cy="-30" r="8" fill="#2e8b57" />
        <circle cx="0" cy="-35" r="8" fill="#2e8b57" />
        <circle cx="20" cy="-30" r="8" fill="#2e8b57" />
        <circle cx="40" cy="-20" r="8" fill="#2e8b57" />
    </g>

    <!-- Cartoon Senator 2 (Right) -->
    <g transform="translate(1350, 570)">
        <!-- Body / Toga -->
        <path d="M -45,230 C -55,100 -15,50 0,50 C 15,50 55,100 45,230 Z" fill="#ffffff" stroke="#000000" stroke-width="8" />
        <!-- Head -->
        <circle cx="0" cy="0" r="45" fill="#ffdfc4" stroke="#000000" stroke-width="8" />
        <!-- Eyes -->
        <circle cx="-15" cy="-5" r="5" fill="#000000" />
        <circle cx="15" cy="-5" r="5" fill="#000000" />
        <!-- Mouth -->
        <path d="M -10,20 Q 0,25 10,20" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    </g>

</svg>