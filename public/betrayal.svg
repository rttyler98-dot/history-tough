<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

    <!-- Background -->
    <rect width="1920" height="1080" fill="#a64d4d" />

    <!-- Action Lines -->
    <line x1="0" y1="0" x2="1920" y2="1080" stroke="#803333" stroke-width="20" stroke-dasharray="100, 100" />
    <line x1="1920" y1="0" x2="0" y2="1080" stroke="#803333" stroke-width="20" stroke-dasharray="100, 100" />

    <!-- Caesar (Center, Shocked) -->
    <g transform="translate(960, 550)">
        <!-- Body / Toga -->
        <path d="M -70,300 C -80,120 -35,50 0,50 C 35,50 80,120 70,300 Z" fill="#ffffff" stroke="#000000" stroke-width="8" />
        <!-- Purple Sash -->
        <path d="M 45,90 L -45,300 L -70,300 L 25,90 Z" fill="#6a0dad" stroke="#000000" stroke-width="4" />
        <!-- Head -->
        <circle cx="0" cy="0" r="60" fill="#ffdfc4" stroke="#000000" stroke-width="8" />
        <!-- Eyes (Wide, Shocked) -->
        <circle cx="-20" cy="-5" r="12" fill="#ffffff" stroke="#000000" stroke-width="3" />
        <circle cx="-20" cy="-5" r="4" fill="#000000" />
        <circle cx="20" cy="-5" r="12" fill="#ffffff" stroke="#000000" stroke-width="3" />
        <circle cx="20" cy="-5" r="4" fill="#000000" />
        <!-- Mouth (Screaming) -->
        <ellipse cx="0" cy="30" rx="15" ry="20" fill="#000000" />
        <!-- Laurel Wreath falling -->
        <g transform="translate(0, -60) rotate(-20)">
            <path d="M -55,-10 Q 0,-40 55,-10" fill="none" stroke="#2e8b57" stroke-width="12" />
            <circle cx="-40" cy="-20" r="8" fill="#2e8b57" />
            <circle cx="-20" cy="-30" r="8" fill="#2e8b57" />
            <circle cx="0" cy="-35" r="8" fill="#2e8b57" />
            <circle cx="20" cy="-30" r="8" fill="#2e8b57" />
            <circle cx="40" cy="-20" r="8" fill="#2e8b57" />
        </g>
    </g>

    <!-- Conspirator 1 (Left) -->
    <g transform="translate(500, 580)">
        <!-- Body -->
        <path d="M -50,250 C -60,100 -20,50 0,50 C 20,50 60,100 50,250 Z" fill="#e0e0e0" stroke="#000000" stroke-width="8" />
        <!-- Arm holding dagger -->
        <path d="M 30,120 L 250,-50" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round" />
        <!-- Dagger -->
        <g transform="translate(250, -50) rotate(45)">
            <rect x="-10" y="-10" width="20" height="40" fill="#8b4513" stroke="#000000" stroke-width="4" />
            <polygon points="-15,30 15,30 0,100" fill="#c0c0c0" stroke="#000000" stroke-width="4" />
        </g>
        <!-- Head -->
        <circle cx="0" cy="0" r="50" fill="#ffdfc4" stroke="#000000" stroke-width="8" />
        <!-- Eyes (Angry) -->
        <circle cx="-15" cy="-5" r="5" fill="#000000" />
        <circle cx="15" cy="-5" r="5" fill="#000000" />
        <path d="M -30,-15 L -5,-10" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />
        <path d="M 30,-15 L 5,-10" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />
        <!-- Mouth (Gritting teeth) -->
        <rect x="-15" y="20" width="30" height="10" fill="#ffffff" stroke="#000000" stroke-width="3" />
        <line x1="0" y1="20" x2="0" y2="30" stroke="#000000" stroke-width="3" />
    </g>

    <!-- Conspirator 2 (Right) -->
    <g transform="translate(1420, 580)">
        <!-- Body -->
        <path d="M -50,250 C -60,100 -20,50 0,50 C 20,50 60,100 50,250 Z" fill="#e0e0e0" stroke="#000000" stroke-width="8" />
        <!-- Arm holding dagger -->
        <path d="M -30,120 L -250,-50" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round" />
        <!-- Dagger -->
        <g transform="translate(-250, -50) rotate(-45)">
            <rect x="-10" y="-10" width="20" height="40" fill="#8b4513" stroke="#000000" stroke-width="4" />
            <polygon points="-15,30 15,30 0,100" fill="#c0c0c0" stroke="#000000" stroke-width="4" />
        </g>
        <!-- Head -->
        <circle cx="0" cy="0" r="50" fill="#ffdfc4" stroke="#000000" stroke-width="8" />
        <!-- Eyes (Angry) -->
        <circle cx="-15" cy="-5" r="5" fill="#000000" />
        <circle cx="15" cy="-5" r="5" fill="#000000" />
        <path d="M -30,-15 L -5,-10" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />
        <path d="M 30,-15 L 5,-10" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />
        <!-- Mouth (Gritting teeth) -->
        <rect x="-15" y="20" width="30" height="10" fill="#ffffff" stroke="#000000" stroke-width="3" />
        <line x1="0" y1="20" x2="0" y2="30" stroke="#000000" stroke-width="3" />
    </g>

</svg>