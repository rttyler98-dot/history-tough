<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Body -->
  <path d="M 25 100 L 25 60 Q 25 35 50 35 Q 75 35 75 60 L 75 100 Z" fill="#4a4a4a" />
  <path d="M 25 100 L 25 60 Q 25 35 50 35 Q 75 35 75 60 L 75 100 Z" fill="rgba(0,0,0,0.3)" clip-path="polygon(50% 0, 100% 0, 100% 100%, 50% 100%)" />

  <!-- Head -->
  <circle cx="50" cy="30" r="20" fill="#f4d0a3" />

  <!-- Hair (short Roman style) -->
  <path d="M 30 30 Q 30 10 50 10 Q 70 10 70 30 Q 50 20 30 30 Z" fill="#000" />

  <!-- Eyes (Angry/Betraying) -->
  <path d="M 38 24 L 46 27" stroke="#000" stroke-width="2" />
  <circle cx="43" cy="28" r="2" fill="#000" />
  <path d="M 62 24 L 54 27" stroke="#000" stroke-width="2" />
  <circle cx="57" cy="28" r="2" fill="#000" />

  <!-- Expression (Grimace) -->
  <path d="M 45 38 Q 50 35 55 38" stroke="#000" stroke-width="2" fill="none" />

  <!-- Dagger -->
  <path d="M 70 60 L 90 50 L 88 45 L 68 55 Z" fill="#888" />
  <path d="M 88 45 L 95 30 L 90 50 Z" fill="#silver" />
</svg>
